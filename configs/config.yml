# a2i2-extraction runtime configuration.
# This is the single source of truth for all tuneable parameters.
# Override any key via environment variable or .env (env vars take priority).

# ── Service URLs ──────────────────────────────────────────────────────────────
mineru_url: http://mineru:8000
llm_url: http://llm:8000/v1

# ── LLM ──────────────────────────────────────────────────────────────────────
llm_model_name: Qwen/Qwen3.5-9B
llm_api_key: EMPTY
llm_max_tokens: 16000        # max output tokens the LLM may generate
llm_temperature: 0.0
llm_request_timeout_s: 600.0
llm_max_model_len: 131072    # vLLM --max-model-len (input + output context window)
llm_dtype: bfloat16          # vLLM --dtype (auto, bfloat16, float16)
llm_send_images: false       # if false, skip mineru figures (text-only prompt)

# ── Service timeouts (seconds) ───────────────────────────────────────────────
mineru_timeout_s: 600.0

# ── Pipeline ──────────────────────────────────────────────────────────────────
output_dir: outputs
