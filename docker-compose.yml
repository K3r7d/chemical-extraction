# a2i2-extraction stack: orchestrator + MinerU + vLLM.
#
# To change the LLM model, edit LLM_MODEL here (two places: orchestrator + llm).
# One-touch start: docker compose up -d

x-llm-model: &llm-model Qwen/Qwen3.5-9B

services:
  data-init:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash scripts/download_data.sh
    volumes:
      - .:/workspace

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    image: a2i2/orchestrator:0.1.0
    environment:
      MINERU_URL: http://mineru:8000
      LLM_URL: http://llm:8000/v1
      LLM_MODEL_NAME: *llm-model
      OUTPUT_DIR: /outputs
    ports:
      - "28080:8080"
    volumes:
      - ./data:/data:ro
      - ./outputs:/outputs
    depends_on:
      data-init:
        condition: service_completed_successfully
      mineru:
        condition: service_healthy
      llm:
        condition: service_healthy

  mineru:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
    image: a2i2/mineru:0.1.0
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      DATA_PAPERS_ROOT: /data/papers
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  llm:
    build:
      context: .
      dockerfile: docker/vllm.Dockerfile
    image: a2i2/vllm:0.1.0
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      LLM_MODEL_NAME: *llm-model
      TENSOR_PARALLEL_SIZE: auto
      LLM_DTYPE: bfloat16
      LLM_MAX_MODEL_LEN: "81920"
    ports:
      - "28000:8000"
    volumes:
      - hf-cache:/cache/huggingface
    shm_size: "16gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s

volumes:
  hf-cache:
